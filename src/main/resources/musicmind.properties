text.cliDesc.login=Connect Spotify (opens your browser the first time).
text.cliDesc.help=Show this list.
text.cliDesc.exit=Leave an interactive session.
text.cliDesc.profile=F1 Show your taste profile; --refresh rebuilds it, --range picks the time range.
text.cliDesc.trends=F2 Show how your taste changed across time ranges.
text.cliDesc.search=F3 Search for music in plain words.
text.cliDesc.discover=F4 Get new music recommendations; --novelty is 0 (all familiar) to 1 (all new).
text.cliDesc.create=F5 Create a Spotify playlist from a goal; F11 asks what to relax if the request cannot be met.
text.cliDesc.modify=F6 Change a playlist from a sentence.
text.cliDesc.undo=F6 Undo the last change to a playlist.
text.cliDesc.validate=F7 Check a playlist against its constraints.
text.cliDesc.prefs=F8 List, read or set your preferences.
text.cliDesc.feedback=F9 Accept or reject a track so later picks learn from it.
text.cliDesc.explain=F10 Explain why a playlist's tracks were chosen.
text.cliDesc.history=F12 Show past requests and saved playlist versions.
text.cliDesc.restore=F12 Put a playlist back to a saved version.


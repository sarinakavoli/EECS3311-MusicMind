# MusicMind tunables, read through com.musicmind.config.Config.
# Secrets and per-machine settings live in .env, never here.

# Playlist validation: allowed deviation from the target duration (0.10 = +/-10%).
playlist.durationTolerance=0.10
# Validation: the fewest and most tracks a playlist may hold (Spotify allows up to 10000 items).
playlist.minTracks=1
playlist.maxTracks=10000

# Recommendation strategies: average track length used to turn minutes into a track count,
# and the count used when the spec has no target duration.
strategy.avgTrackMinutes=4
strategy.defaultTrackCount=20

# Spotify Web API
spotify.apiBaseUrl=https://api.spotify.com/v1
spotify.tokenUrl=https://accounts.spotify.com/api/token
# Development Mode caps search pages at 10.
spotify.searchPageSize=10
spotify.libraryPageSize=50
# Upper bound on items collected by any paged read.
spotify.maxItems=500
# Saved tracks are read up to this many; past it the profile and discover say some were not checked.
spotify.maxSavedTracks=5000
spotify.authorizeUrl=https://accounts.spotify.com/authorize
# Playlist items are read 100 per page and added or removed in batches of 100 (the API maximum).
spotify.playlistPageSize=100
spotify.addBatchSize=100
spotify.topItemsLimit=20
spotify.recentlyPlayedLimit=50
# /artists/{id}/albums rejects any limit above 10 (HTTP 400); /albums/{id}/tracks accepts 50.
spotify.artistAlbumPageSize=10
spotify.albumTrackPageSize=50
# Retries for HTTP 429 / 5xx, and the longest Retry-After (seconds) we are willing to wait.
spotify.retryCount=3
spotify.maxWaitSeconds=60

# MusicBrainz (artist genres; Spotify returns none to this app). Public API, no key.
musicbrainz.baseUrl=https://musicbrainz.org/ws/2
musicbrainz.userAgent=MusicMind/0.2 ( https://github.com/sarinakavoli/EECS3311-MusicMind )
# Their limit is 1 request per second, shared by every lookup; 1100 keeps clearly under it.
musicbrainz.minIntervalMillis=1100
# A search hit is accepted only at or above this score (0-100) and only if the name or an alias matches.
musicbrainz.minScore=90
musicbrainz.resultLimit=5
# After HTTP 503 wait Retry-After (or this many seconds if absent) and retry once; a longer Retry-After gives up.
musicbrainz.retryWaitSeconds=2
musicbrainz.maxWaitSeconds=30
# Connect and response timeout for each MusicBrainz request.
musicbrainz.timeoutSeconds=10
# Cached genres (including "no match") are fetched again after this many days.
musicbrainz.cacheDays=30
# After this many failed lookups in a row (timeouts, connection failures, server errors; a rate-limit 503 does not count), lookups are skipped for the cooldown (seconds) so a run finishes quickly
# during an outage. Skipped lookups are not cached and count as failures in the partial-genres notice.
musicbrainz.maxConsecutiveFailures=3
musicbrainz.cooldownSeconds=300

# Characters of a raw HTTP response body kept in an error message.
http.errorBodyLimit=300

# LLM (OpenAI chat completions)
openai.baseUrl=https://api.openai.com/v1
openai.timeoutSeconds=30
llm.defaultModel=gpt-4o

# PostgreSQL
database.connectTimeoutSeconds=5

# Prompts: most genres listed in any prompt (prompts never carry bulk data).
prompt.maxGenres=10

# LLM response parsing: bounds used to clamp, and defaults for fields the model omitted.
parser.minTargetMinutes=1
parser.maxTargetMinutes=600
parser.defaultTargetMinutes=60
parser.defaultFamiliarRatio=0.5
parser.defaultPlaylistName=MusicMind Playlist

# Taste profile (F1) and trends (F2)
# Time ranges in order from most recent to oldest; the first listed is the default for `profile`.
profile.ranges=short,medium,long
profile.defaultRange=medium
# Fewer top artists or top tracks than this makes a profile partial ("little history").
profile.minItems=5
# A stored profile older than this many hours is rebuilt before discovery uses it.
profile.maxAgeHours=24
# Trends: a range where fewer than this share of artists have genre data (MusicBrainz lists many artists
# without any) is called partial, and the narrative does not claim a genre change from it.
trends.minGenreCoverage=0.5
# Genres named in the computed (non-LLM) summary and trend narrative.
profile.fallbackGenres=3

# Natural-language search (F3)
# Total tracks requested per search (the adapter fetches them in pages of spotify.searchPageSize).
search.resultLimit=20
# Filter fields (besides keywords and genre) a parsed query may send to Spotify; others are dropped.
search.allowedFilters=year,artist
# A parsed query below this confidence falls back to a raw keyword search on the original text.
search.minConfidence=0.5
# Ranking weights: Spotify's own relevance order leads; the share of query words found in the title is a small
# boost (about two places in a 20-result page). A higher title weight let stock-music titles that repeat the
# query words outrank Spotify's best matches in a live mood search.
search.weight.titleMatch=0.1
search.weight.spotifyOrder=0.9

# Personalised discovery (F4)
# Share of familiar tracks when neither --novelty nor a stored familiar bias says otherwise.
discover.defaultFamiliarRatio=0.7
# A familiar share at or above the first picks FamiliarStrategy; at or below the second, DiscoveryStrategy; else Balanced.
discover.familiarStrategyMin=0.85
discover.discoveryStrategyMax=0.15
# Candidate pools: genres searched at first, top artists whose albums are read, albums per artist,
# and tracks requested per genre search (the adapter pages them by spotify.searchPageSize).
discover.initialGenres=3
discover.artistSeeds=5
discover.albumsPerArtist=2
discover.searchLimit=20
# Fewer results than this (or than the requested track count, if smaller) is "too few": widen and retry.
discover.minResults=10
# Each widening step searches this many more genres and raises the familiar share (lowers novelty) by the step.
discover.widenSteps=2
discover.widenGenresPerStep=3
discover.widenNoveltyStep=0.2
# Score = fit*(1-|familiarity-ratio|) + genre*(genre affinity) + acceptBoost or -rejectPenalty from feedback.
discover.weight.fit=0.5
discover.weight.genre=0.3
discover.feedback.acceptBoost=0.5
discover.feedback.rejectPenalty=1.0

# Playlist creation (F5) and negotiation (F11)
# Validation failures that send the run back to selection before it gives up.
plan.maxValidationRetries=3
# A goal the model is less sure of than this asks the user to say more. A reply with no confidence counts as the default.
plan.minConfidence=0.5
plan.defaultConfidence=1.0
# Genres taken from the mood map and the stored preferred styles to steer a playlist.
plan.maxSeedGenres=4
# Relaxations the user may accept in one run before the request is dropped.
plan.maxNegotiationRounds=3


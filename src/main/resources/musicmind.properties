# Natural-language edits (F6): the mood heuristic swaps out at most maxChanges tracks that are known not to fit,
# or adds addCount tracks from the mood's genres when none is known to misfit.
# Most tracks an edit prompt may list; a longer playlist is refused instead of overflowing the model.
edit.maxPromptTracks=200
edit.mood.maxChanges=5
edit.mood.addCount=3
